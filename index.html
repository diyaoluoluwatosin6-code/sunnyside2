!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
</head>
<body>
    <form>
        <h1>Contac Us</h1>

        <label for="firstName">
            First Name *
        </label>
        <input id="firstName" type="text">

         <label for="lastName">
            Last Name *
        </label>
        <input id="lastName" type="text">

         <label for="email">
            Email Address *
        </label>
        <input id="email" type="email">

        <label for="query">Query Type *</label>

        <div>
            <input id="enquiry" type="radio" name="query">
            <label for="enquiry">General Enquiry</label>
        </div>

        <div>
            <input id="support" type="radio" name="query">
            <label for="support">Support Request</label>
        </div>

    </form>
    
</body>
</html>
